<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .logo-wrap { background: #fff; padding: 24px 32px; text-align: center; }
        .header { background: #4f46e5; padding: 28px 32px; }
        .header h1 { color: #fff; margin: 0; font-size: 20px; }
        .body { padding: 32px; color: #333; }
        .body p { line-height: 1.6; }
        .quote { background: #f3f4f6; border-left: 4px solid #4f46e5; padding: 12px 16px; border-radius: 4px; margin: 16px 0; color: #555; font-style: italic; }
        .footer { padding: 16px 32px; background: #f9f9f9; color: #888; font-size: 12px; text-align: center; }
    </style>
    <title></title>
</head>
<body>
<div class="container">
    <div class="logo-wrap">
        <img src="cid:logo" alt="Project FUMO" width="200" style="display:block;margin:0 auto;"/>
    </div>
    <div class="header">
        <h1>Нова відповідь на ваш коментар</h1>
    </div>
    <div class="body">
        <p>Привіт, <strong th:text="${recipientUsername}">Користувач</strong>!</p>
        <p><strong th:text="${replierUsername}">Хтось</strong> відповів на ваш коментар у публікації
            <strong th:text="${postTitle}">Публікація</strong>:</p>
        <div class="quote" th:text="${replyContent}">Текст відповіді</div>
        <p>Зайдіть на сайт, щоб переглянути відповідь та продовжити розмову.</p>
    </div>
    <div class="footer">
        <p>Ви отримали цей лист, оскільки хтось відповів на ваш коментар.</p>
    </div>
</div>
</body>
</html>
